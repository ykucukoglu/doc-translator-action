name: 'Doc Translator'
description: 'AST-aware Markdown translation via Markdig + LLM (Gemini, OpenAI, Claude, or Azure OpenAI), opens a pull request with the results.'
author: 'doc-translator-action'

inputs:
  github-token:
    description: 'GitHub token used to push the translation branch and open the pull request. Required unless pr-mode (or dry-run) disables PR creation.'
    required: false
  gemini-api-key:
    description: 'Google Gemini API key. Set this, openai-api-key, or anthropic-api-key.'
    required: false
  openai-api-key:
    description: 'OpenAI API key. Set this, gemini-api-key, or anthropic-api-key.'
    required: false
  anthropic-api-key:
    description: 'Anthropic (Claude) API key. Set this, gemini-api-key, openai-api-key, or azure-openai-api-key.'
    required: false
  azure-openai-api-key:
    description: 'Azure OpenAI API key. Set this (along with azure-openai-endpoint and azure-openai-deployment), or one of gemini-api-key, openai-api-key, anthropic-api-key.'
    required: false
  azure-openai-endpoint:
    description: 'Azure OpenAI resource endpoint, e.g. https://your-resource.openai.azure.com/. Required when using azure-openai-api-key.'
    required: false
  azure-openai-deployment:
    description: 'Azure OpenAI deployment name (the name chosen when the model was deployed in your Azure OpenAI resource, not necessarily the underlying model id). Required when using azure-openai-api-key.'
    required: false
  llm-provider:
    description: "Which LLM provider to use: auto, gemini, openai, claude, azure-openai, or fake. 'auto' requires exactly one of the *-api-key inputs to be set; if more than one is set, llm-provider must be set explicitly."
    required: false
    default: 'auto'
  llm-fallback-provider:
    description: 'Second provider (gemini, openai, claude, azure-openai, or fake) to retry against once if the primary llm-provider fails after exhausting its own retries (rate limit, outage, quota). Must be different from the primary; requires that provider''s own credentials to also be set. Off by default.'
    required: false
  gemini-model:
    description: 'Gemini model id.'
    required: false
    default: 'gemini-2.5-flash'
  openai-model:
    description: 'OpenAI model id.'
    required: false
    default: 'gpt-5-mini'
  openai-base-url:
    description: 'Redirects the openai provider at any OpenAI-compatible endpoint (e.g. Ollama, LM Studio, vLLM, OpenRouter) instead of api.openai.com - lets this run against a free/local model with no real OpenAI account. openai-api-key is still required but can be any non-empty placeholder value if the endpoint does not check it.'
    required: false
  claude-model:
    description: 'Claude model id.'
    required: false
    default: 'claude-sonnet-5'
  target-languages:
    description: 'Comma-separated target language codes, e.g. tr,de,fr.'
    required: false
    default: 'tr'
  source-path:
    description: 'Root folder to scan for documentation.'
    required: false
    default: 'docs'
  include-glob:
    description: 'Glob (relative to source-path) selecting which files to translate.'
    required: false
    default: '**/*.md'
  glossary-path:
    description: 'Path to the .doc-terms.json glossary file.'
    required: false
    default: '.doc-terms.json'
  config-path:
    description: 'Path to an optional JSON config file supplying any of target-languages, source-path, include-glob, glossary-path, output-path-template, base-branch, fail-on-stale-translations, backfill-missing-translations, estimate-cost-only, max-parallel-requests, cleanup-stale-branches, source-language, max-batch-tokens, translate-mermaid-diagrams, push-to-current-branch, llm-provider, llm-fallback-provider, gemini-model, openai-model, openai-base-url, claude-model - lets advanced setups avoid a large `with:` block. Explicit inputs always take priority over the config file. Note: allow-fork-pull-request-target is deliberately NOT supported here - see its own description below.'
    required: false
  output-path-template:
    description: 'Template for translated file output paths. Supports {lang}, {relativePath}, {dir}, {filename}, {ext} - e.g. "{dir}/{filename}.{lang}.{ext}" for MkDocs/Docusaurus-style co-located naming.'
    required: false
    default: 'docs/{lang}/{relativePath}'
  base-branch:
    description: 'Base branch to diff against and to open the pull request into. Defaults to GITHUB_BASE_REF (pull_request events) or the previous commit (push events).'
    required: false
  pr-mode:
    description: 'When true (default), pushes a branch and opens a pull request with the translated files. When false, behaves like dry-run: writes translated files locally only, no github-token required.'
    required: false
    default: 'true'
  dry-run:
    description: 'Explicit override for pr-mode: when true, writes translated files locally without pushing a branch or opening a pull request, regardless of pr-mode.'
    required: false
  fail-on-stale-translations:
    description: 'When true, the action exits non-zero if any existing translated file is out of sync with its current source (see the drift-marker feature).'
    required: false
    default: 'false'
  max-parallel-requests:
    description: 'Bounds how many LLM batch requests run concurrently per file/language.'
    required: false
    default: '4'
  backfill-missing-translations:
    description: 'When true, also translates any source file/language pair with no existing output yet, regardless of this run''s diff - use on a first install (to translate pre-existing docs that never "changed") or after adding a new target language. Off by default so a first run never surprises you with translating the whole doc set unasked.'
    required: false
    default: 'false'
  estimate-cost-only:
    description: 'When true, reports an estimated input-token count for the files/languages this run would translate (skipping anything already cached) and exits - no LLM call, no git/GitHub access. Useful before a first backfill run against a large existing doc set.'
    required: false
    default: 'false'
  cleanup-stale-branches:
    description: 'When true (default), deletes this action''s own doc-translator/<sha> branches once their pull request is closed (merged or declined) - otherwise a new branch is left behind every run. Scoped strictly to that name prefix and to branches with a known closed PR; a branch with no matching PR is left untouched. Set to false to disable.'
    required: false
    default: 'true'
  source-language:
    description: 'Source language code told to the LLM, or "auto" (default) to leave it unstated and let the model infer it from the content.'
    required: false
    default: 'auto'
  max-batch-tokens:
    description: 'Approximate token budget per LLM batch request (char/4 heuristic).'
    required: false
    default: '4000'
  verbose:
    description: 'When true, prints the full exception (not just its message) to stderr on failure.'
    required: false
    default: 'false'
  translate-mermaid-diagrams:
    description: 'When true, translates node/edge/subgraph text labels inside ```mermaid flowchart/graph diagrams, leaving arrows, node ids, and the diagram syntax itself untouched. Off by default; only flowchart/graph diagrams are supported (other mermaid diagram types and PlantUML are left as-is).'
    required: false
    default: 'false'
  push-to-current-branch:
    description: 'When true, commits and pushes translated files directly onto whatever branch is already checked out - no new branch, no pull request. For a workflow that already has a specific branch checked out for a reason of its own, e.g. a PR-comment-triggered run pushing back onto that PR''s own branch. Requires the checkout to be a real branch, not a detached HEAD. Off by default.'
    required: false
    default: 'false'
  allow-fork-pull-request-target:
    description: 'On a pull_request_target run triggered by a fork PR, this action forces dry-run by default regardless of pr-mode - that combination runs with the base repository''s secrets/token against untrusted PR content, a known secret-exfiltration pattern. Set this to true only if you understand the risk and have already gated the job (e.g. behind a manual approval environment). Must be set as this literal action input, not via config-path - a config file is read from the job''s working directory, which in this exact scenario can be the fork PR''s own checked-out content.'
    required: false
    default: 'false'

outputs:
  pr-url:
    description: 'URL of the opened (or reused) pull request. Empty on a dry run or when nothing was translated.'
  pr-was-created:
    description: '"true" if this run opened a new pull request, "false" if it reused an already-open one (or nothing was published).'
  translated-files-count:
    description: 'Number of translated files written in this run.'
  stale-translations-count:
    description: 'Number of existing translated files found to be out of sync with their source.'

runs:
  using: 'docker'
  image: 'Dockerfile'

branding:
  icon: 'globe'
  color: 'blue'
