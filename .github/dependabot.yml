version: 2
updates:
  # Covers every .csproj under the repo root, including the beta Anthropic SDK - a breaking
  # change there should show up as a reviewable PR, not a silent runtime failure.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      # Pinned to 7.x deliberately: FluentAssertions 8+ requires a commercial license, and this
      # project is meant to build with nothing but free/open packages.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # Pinned to this exact beta build deliberately (API churns across betas) - any bump here,
      # including a minor/patch one, needs a deliberate migration pass, not an automated PR.
      - dependency-name: "System.CommandLine"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The project deliberately targets .NET 9 (every .csproj's TargetFramework, and the SDK/
    # runtime base images) - see the Dockerfile's own comment on this. A major-version bump here
    # is a deliberate, whole-project upgrade decision, not something to accept from an automated
    # PR; only patch/minor updates within 9.x are proposed.
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/runtime"
        update-types: ["version-update:semver-major"]
