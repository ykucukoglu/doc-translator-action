name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DocTranslator.sln

      - name: Build
        run: dotnet build DocTranslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test DocTranslator.sln -c Release --no-build
