name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DocTranslator.sln

      - name: Build
        run: dotnet build DocTranslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test DocTranslator.sln -c Release --no-build

      # Exercises the full Cli wiring (diff -> parse -> translate -> reconstruct -> write) against
      # a real throwaway repo, with --use-fake-llm standing in for a real provider - no network,
      # no API key. This is the same command that caught the output-path-duplication and
      # self-translation-cascade bugs by hand during dogfooding; running it on every push catches
      # that class of orchestration-wiring regression before a real workflow run has to.
      - name: Smoke test (fake LLM, dry run)
        # On the pull_request trigger, the runner sets GITHUB_BASE_REF=main for the whole job -
        # which the Cli would otherwise inherit and try to resolve against the freshly `git
        # init`'d scratch repo below (which has no "main" ref at all). A step-level `env:`
        # override was tried first but didn't reliably reach the `dotnet run` child process here
        # (likely the MSBuild/compiler server persisting the job's original environment across
        # steps) - passing --base-branch "" as an explicit CLI argument sidesteps environment
        # propagation entirely: ActionOptionsCliOverrides.BaseBranch becomes "" (not null), which
        # short-circuits every env-var-based fallback, and the diff analyzer treats an empty
        # baseRef as "diff against the previous commit", same as a real push event.
        run: |
          set -e
          scratch=$(mktemp -d)
          mkdir -p "$scratch/docs"
          cd "$scratch"
          git init -q
          git config user.email smoke-test@example.com
          git config user.name "smoke test"
          echo "# Hello" > docs/guide.md
          git add . && git commit -q -m base
          echo "# Hello revised" > docs/guide.md
          git add . && git commit -q -m revise
          dotnet run -c Release --project "$GITHUB_WORKSPACE/src/DocTranslator.Cli" -- \
            --dry-run --use-fake-llm --target-languages tr --source-path docs --base-branch ""
          test -f docs/tr/guide.md
          test ! -d docs/tr/docs
