name: Dogfooding

# Uses this repository's own action to translate its own docs/ - the best end-to-end proof that
# the AST parse -> translate -> self-heal -> reconstruct -> PR pipeline actually works.
#
# Requires a GEMINI_API_KEY repository secret. On pull_request, runs in pr-mode: false (writes
# files locally, no push) so PRs - including ones from forks without secret access - never open a
# nested PR from within a check. On push to main, runs in full pr-mode: true and opens a real
# translation PR.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      pr_mode:
        description: 'Open a real pull request with the translated docs (vs. a dry validation run)'
        type: boolean
        default: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2 # doc-translator-action diffs against the previous commit / base ref

      # Computed in shell, not a GitHub Actions `A && B || C` expression: that pattern is a known
      # trap when B can itself be a falsy value (like this false/false case) - it falls through to
      # C exactly like JavaScript's `&&`/`||` ternary emulation does, so it's unreliable here.
      - name: Determine pr-mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pr_mode=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pr_mode }}" = "true" ]; then
            echo "pr_mode=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr_mode=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate docs
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          target-languages: tr,de
          source-path: docs
          pr-mode: ${{ steps.mode.outputs.pr_mode }}
          # GEMINI_API_KEY here is a free-tier key with a low per-minute request limit. The
          # default concurrency (4) fires enough parallel batch requests across 2 target languages
          # to blow through that limit in one burst - keep this at 1 so dogfooding runs stay within
          # a real free-tier quota instead of relying on retry/backoff to absorb 429s.
          max-parallel-requests: 1
